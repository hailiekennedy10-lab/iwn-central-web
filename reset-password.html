<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>IWN Central — Reset Password</title>
  <style>
    :root { --purple:#6B21A8; --ink:#111827; --muted:#6B7280; --border:#E5E7EB; --bg:#F5F3F8; --danger:#B91C1C; --green:#15803D; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
    .card { background:#fff; border:1px solid var(--border); border-radius:18px; padding:28px 24px; width:100%; max-width:400px; box-shadow:0 8px 30px rgba(17,24,39,.08); }
    .brand { font-size:22px; font-weight:800; color:var(--purple); margin:0 0 2px; }
    h1 { font-size:19px; margin:0 0 6px; }
    .hint { font-size:14px; color:var(--muted); line-height:1.45; margin:0 0 18px; }
    .hint.error { color:var(--danger); }
    label { display:block; font-size:13px; font-weight:600; margin:14px 0 6px; }
    input { width:100%; padding:12px 14px; font-size:16px; border:1px solid var(--border); border-radius:10px; background:#fafafa; }
    input:focus { outline:none; border-color:var(--purple); background:#fff; }
    button { width:100%; margin-top:20px; padding:14px; font-size:16px; font-weight:700; color:#fff; background:var(--purple); border:none; border-radius:10px; cursor:pointer; }
    button:disabled { opacity:.6; cursor:default; }
    .ok { color:var(--green); font-weight:600; }
    .center { text-align:center; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">IWN Central</div>
    <h1>Reset your password</h1>
    <div id="status" class="hint">Verifying your reset link&hellip;</div>

    <form id="form" style="display:none">
      <label for="pw">New password</label>
      <input id="pw" type="password" autocomplete="new-password" placeholder="At least 8 characters" />
      <label for="pw2">Confirm new password</label>
      <input id="pw2" type="password" autocomplete="new-password" placeholder="Re-enter password" />
      <button id="submit" type="submit">Set new password</button>
    </form>

    <div id="done" style="display:none" class="center">
      <p class="ok">&#10003; Your password has been updated.</p>
      <p class="hint">Open the IWN Central app and log in with your new password.</p>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    var SUPABASE_URL = 'https://lstlpgiwssgblfeofizp.supabase.co';
    var SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxzdGxwZ2l3c3NnYmxmZW9maXpwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODE3OTkzODMsImV4cCI6MjA5NzM3NTM4M30.Y6ar4QtrfsLvoscogw6ZIH27sXfmXyfhEsnQ4B1ffLY';

    var sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
      auth: { detectSessionInUrl: true, flowType: 'implicit', persistSession: false }
    });

    var statusEl = document.getElementById('status');
    var formEl = document.getElementById('form');
    var doneEl = document.getElementById('done');

    function showForm() { statusEl.style.display = 'none'; formEl.style.display = 'block'; }
    function fail(msg) { statusEl.textContent = msg; statusEl.className = 'hint error'; }

    async function init() {
      try {
        var url = new URL(window.location.href);
        // Custom-template case: ?token_hash=&type=recovery (works cross-device).
        var token_hash = url.searchParams.get('token_hash');
        var type = url.searchParams.get('type');
        if (token_hash) {
          var r1 = await sb.auth.verifyOtp({ type: type || 'recovery', token_hash: token_hash });
          if (!r1.error) return showForm();
        }
        // PKCE case: ?code= (same-device).
        var code = url.searchParams.get('code');
        if (code) {
          var r2 = await sb.auth.exchangeCodeForSession(code);
          if (!r2.error) return showForm();
        }
        // Default case: Supabase redirected here with tokens in the URL hash;
        // detectSessionInUrl consumes them. Poll briefly for the session.
        sb.auth.onAuthStateChange(function (_e, session) { if (session) showForm(); });
        for (var i = 0; i < 8; i++) {
          var s = await sb.auth.getSession();
          if (s.data.session) return showForm();
          await new Promise(function (res) { setTimeout(res, 300); });
        }
        fail('This reset link is invalid or has expired. Please open the app and request a new reset link.');
      } catch (e) {
        fail('Something went wrong verifying your link. Please request a new reset link from the app.');
      }
    }

    formEl.addEventListener('submit', async function (e) {
      e.preventDefault();
      var pw = document.getElementById('pw').value;
      var pw2 = document.getElementById('pw2').value;
      if (pw.length < 8) { alert('Password must be at least 8 characters.'); return; }
      if (pw !== pw2) { alert('The two passwords do not match.'); return; }
      var btn = document.getElementById('submit');
      btn.disabled = true; btn.textContent = 'Saving…';
      var r = await sb.auth.updateUser({ password: pw });
      if (r.error) { alert(r.error.message); btn.disabled = false; btn.textContent = 'Set new password'; return; }
      formEl.style.display = 'none'; doneEl.style.display = 'block';
    });

    init();
  </script>
</body>
</html>
